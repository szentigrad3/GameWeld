name: CI
on:
  push:
    branches:
      - main
      - release/0.7.0-pc1
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev python3
      - name: Run offline checks
        run: ./scripts/ci-check.sh
