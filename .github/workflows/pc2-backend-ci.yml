name: PC2 Backend (experimental)
on:
  push:
    branches:
      - feature/pc2-source-backend
  pull_request:
    paths:
      - 'cmd/gameweld-backend/**'
      - 'scripts/run-pc2-source-frontend.sh'
      - 'scripts/pc2-test4-aio-report.sh'
      - '.github/workflows/pc2-backend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Go tests
        working-directory: cmd/gameweld-backend
        run: go test -race -count=1 ./...
      - name: Static analysis
        working-directory: cmd/gameweld-backend
        run: go vet ./...
      - name: Compile source backend
        working-directory: cmd/gameweld-backend
        run: go build -trimpath -o /tmp/wand-native-backend .
      - name: Build PC2 GTK frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev
          gcc -O2 -pipe -pthread -DGAMEWELD_PC2_DISCOVERY_ONLY=1 crates/wand-ui/appimage-gtk3/gameweld-native-040.c -o /tmp/gameweld-pc2 $(pkg-config --cflags --libs gtk+-3.0)
      - name: Prevent Steam hook cleanup
        run: |
          set +e
          /tmp/gameweld-pc2 --cleanup-steam-hooks
          status=$?
          set -e
          test "$status" -eq 3
      - name: Verify dev AppDir
        run: |
          bash scripts/run-pc2-source-frontend.sh --check-layout
          test -f build/pc2-source/dev-AppDir/usr/libexec/gameweld-wand-discovery.py
      - name: Test 4 compatibility diagnostics
        run: |
          bash -n scripts/pc2-test4-aio-report.sh
          bash scripts/pc2-test4-aio-report.sh
          test -s build/pc2-source/pc2-test4-aio-report.txt
      - name: Test 5 metadata cause diagnostics
        run: |
          bash -n scripts/pc2-test5-aio-report.sh
          bash scripts/pc2-test5-aio-report.sh
          test -s build/pc2-source/pc2-test5-aio-report.txt
          grep -q 'Result: PASS' build/pc2-source/pc2-test5-aio-report.txt
          grep -q 'Compatibility verified: false' build/pc2-source/pc2-test5-aio-report.txt
      - name: Test 6 legacy sidecar evidence
        run: |
          bash -n scripts/pc2-test6-aio-report.sh
          bash scripts/pc2-test6-aio-report.sh
          test -s build/pc2-source/pc2-test6-aio-report.txt
          grep -q 'Result: PASS' build/pc2-source/pc2-test6-aio-report.txt
          grep -q 'Compatibility verified: false' build/pc2-source/pc2-test6-aio-report.txt
      - name: Test 7 read-only runtime fingerprints
        run: |
          bash -n scripts/pc2-test7-aio-report.sh
          bash scripts/pc2-test7-aio-report.sh
          test -s build/pc2-source/pc2-test7-aio-report.txt
          grep -q 'Result: PASS' build/pc2-source/pc2-test7-aio-report.txt
          grep -q 'Integrity verified against trusted reference: false' build/pc2-source/pc2-test7-aio-report.txt
      - name: Test 8 local payload parity
        run: |
          bash -n scripts/pc2-test8-aio-report.sh
          bash scripts/pc2-test8-aio-report.sh
          test -s build/pc2-source/pc2-test8-aio-report.txt
          grep -q 'Result: PASS' build/pc2-source/pc2-test8-aio-report.txt
          grep -q 'Trusted integrity verified: false' build/pc2-source/pc2-test8-aio-report.txt
      - name: Test 9 Steam preview smoke
        run: |
          bash -n scripts/pc2-test9-aio-report.sh
          bash scripts/pc2-test9-aio-report.sh
          test -s build/pc2-source/pc2-test9-aio-report.txt
      - name: Test 10 safe Steam game-only launch gate
        run: |
          bash -n scripts/pc2-test10-aio-report.sh
          bash scripts/pc2-test10-aio-report.sh
          test -s build/pc2-source/pc2-test10-aio-report.txt
          grep -Fq 'Steam game launched: false' build/pc2-source/pc2-test10-aio-report.txt
          grep -Fq 'Inherited opt-in environment: ignored' build/pc2-source/pc2-test10-aio-report.txt
      - name: Test 11 read-only Steam session evidence
        run: |
          bash -n scripts/pc2-test11-aio-report.sh
          bash scripts/pc2-test11-aio-report.sh
          test -s build/pc2-source/pc2-test11-aio-report.txt
          grep -Fq 'Game running confirmed: false' build/pc2-source/pc2-test11-aio-report.txt
      - name: Test 12 targeted Steam session report
        run: |
          bash -n scripts/pc2-test12-aio-report.sh
          bash scripts/pc2-test12-aio-report.sh 346900
          test -s build/pc2-source/pc2-test12-aio-report.txt
          grep -Fq 'Target Steam app ID: 346900' build/pc2-source/pc2-test12-aio-report.txt
          grep -Fq 'Game running confirmed: false' build/pc2-source/pc2-test12-aio-report.txt
      - name: Test 13 read-only Steam process role evidence
        run: |
          bash -n scripts/pc2-test13-aio-report.sh
          bash scripts/pc2-test13-aio-report.sh 346900
          test -s build/pc2-source/pc2-test13-aio-report.txt
          grep -Fq 'Game running confirmed: false' build/pc2-source/pc2-test13-aio-report.txt
          grep -Fq 'Target Steam app ID: 346900' build/pc2-source/pc2-test13-aio-report.txt
      - name: Test 14 native Steam ELF evidence
        run: |
          bash -n scripts/pc2-test14-aio-report.sh
          bash scripts/pc2-test14-aio-report.sh 346900
          test -s build/pc2-source/pc2-test14-aio-report.txt
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test14-aio-report.txt
          grep -Fq 'Game running confirmed: false' build/pc2-source/pc2-test14-aio-report.txt
      - name: DeckCheatz Proton resolver (read-only safety fixtures)
        run: |
          python3 -m py_compile scripts/gameweld-deckcheatz-proton.py
          python3 scripts/test_gameweld_deckcheatz_proton.py
          python3 scripts/test_gameweld_deckcheatz_direct.py
          python3 -m py_compile scripts/gameweld-deckcheatz-install.py
          python3 scripts/gameweld-deckcheatz-install.py --help >/dev/null
          python3 scripts/test_gameweld_deckcheatz_install.py
          python3 scripts/gameweld-deckcheatz-install.py --status
          grep -Fq 'DeckCheatz 1.x — Preview selected game (read-only)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Play with WeMod' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Install DeckCheatz 1.x (managed)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Check DeckCheatz updates' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Update DeckCheatz (opt-in)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Manage existing DeckCheatz checkout' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'pc2_deckcheatz_request_install(experimental_launch)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq -- '--confirm-prefix-changes","--experimental-direct-launch' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
      - name: DeckCheatz one-command offline validation report
        run: |
          bash -n scripts/pc2-deckcheatz-aio.sh
          bash scripts/pc2-deckcheatz-aio.sh
          grep -Fq 'Result: PASS (OFFLINE FIXTURES + GUI SYNTAX ONLY)' build/pc2-source/deckcheatz-aio-report.txt
          grep -Fq 'Real game / WeMod launched: NO' build/pc2-source/deckcheatz-aio-report.txt
      - name: PC2 RC1 offline source preflight
        run: |
          bash -n scripts/pc2-rc1-preflight.sh
          bash scripts/pc2-rc1-preflight.sh
          grep -Fq 'Result: PASS (OFFLINE SOURCE BUILD + FIXTURES ONLY)' build/pc2-source/rc1-preflight/rc1-preflight-report.txt
          test -s build/pc2-source/rc1-preflight/gameweld
          test -s build/pc2-source/rc1-preflight/wand-native-backend
      - name: Validate local PC2 RC1 AppImage packager (syntax only)
        run: |
          bash -n scripts/pc2-build-local-appimage.sh
          bash -n scripts/pc2-rc1-package-audit.sh
          test -s LICENSE && test -s THIRD-PARTY.md
          grep -Fq 'PC2 Steam game-only launch: disabled' scripts/pc2-build-local-appimage.sh
      - name: Stage local PC2 test AppDir with runtime helpers
        run: |
          bash -n scripts/pc2-stage-standalone-appdir.sh
          bash scripts/pc2-stage-standalone-appdir.sh
          app="build/pc2-source/pc2-test-AppDir"
          test -x "$app/AppRun"
          test -s "$app/usr/bin/gameweld"
          test -s "$app/usr/libexec/wand-native-backend"
          test -s "$app/usr/libexec/gameweld-deckcheatz-install.py"
          test -s "$app/usr/libexec/gameweld-deckcheatz-direct.py"
          test -s "$app/usr/libexec/gameweld-deckcheatz-proton.py"
          test -s "$app/usr/libexec/gameweld-steam-compat-bridge.py"
          ! find "$app" -type l -print -quit | grep -q .
          ! find "$app" -type f -name 'wemod.py' -print -quit | grep -q .
      - name: Integrated WeMod Enhancer GUI helper fixtures
        run: |
          python3 -m unittest discover -s scripts -p 'test_gameweld_wemod_enhancer.py' -v
          python3 scripts/gameweld-wemod-enhancer.py status
          python3 -m py_compile scripts/gameweld-wemod-enhancer.py
          grep -Fq 'WeMod Enhancer: Patch WeMod' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'WeMod Enhancer: Restore Original' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Verify Wand Patch + Game (no launch)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Check Wand Patch (no game launch)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Steam Bridge — Game + WeMod' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'WeMod Enhancer — Patch / Restore (advanced)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          ! grep -Fq 'GtkWidget*live_launch=button(' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          ! grep -Fq 'GtkWidget*live_render=button(' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          ! grep -Fq 'GtkWidget*native_play=button(' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'EXISTING WAND / WEMOD INSTALLATIONS' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          ! grep -Fq 'Wand / WeMod Patcher (experimental)' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
      - name: Experimental Steam compatibility bridge (offline, no Steam settings changes)
        run: |
          python3 -m py_compile scripts/gameweld-steam-compat-bridge.py
          python3 -m unittest discover -s scripts -p 'test_gameweld_steam_compat_bridge.py' -v
          python3 -m unittest discover -s scripts -p 'test_gameweld_deckcheatz_gui_layout.py' -v
          python3 -m unittest discover -s scripts -p 'test_gameweld_pc2_recent_games.py' -v
          python3 scripts/gameweld-steam-compat-bridge.py status
          grep -Fq 'pc2_steam_bridge_action("play")' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          ! grep -Fq 'on_pc2_deckcheatz_experimental' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Steam Bridge: Check selected game' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Steam Bridge: Set up selected game' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Steam Bridge: Update installed launcher' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Steam Bridge: Enable WeMod next launch' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
          grep -Fq 'Steam Bridge: Disable WeMod next launch' crates/wand-ui/appimage-gtk3/gameweld-native-040.c
      - name: Verify pinned upstream WeMod Enhancer Linux package
        run: |
          TMP_XDG="$(mktemp -d)"
          export XDG_DATA_HOME="$TMP_XDG"
          python3 scripts/gameweld-wemod-enhancer.py install --confirm
          python3 scripts/gameweld-wemod-enhancer.py status
          test -f "$TMP_XDG/gameweld/tools/wemod-enhancer/v1.0.7/bin/wemod_enhancer.py"
          test -f "$TMP_XDG/gameweld/tools/wemod-enhancer/v1.0.7/bin/version.dll"
          rm -rf -- "$TMP_XDG"
      - name: Test 15 checked Steam command without real game launch
        run: |
          bash -n scripts/pc2-test15-aio-report.sh
          bash scripts/pc2-test15-aio-report.sh 2353250
          test -s build/pc2-source/pc2-test15-aio-report.txt
          grep -Fq 'Steam command launched by this diagnostic: false' build/pc2-source/pc2-test15-aio-report.txt
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test15-aio-report.txt
      - name: Test 16 live Steam Proton Wand handoff fixtures (no real game)
        run: |
          bash -n scripts/pc2-test16-aio-report.sh
          bash scripts/pc2-test16-aio-report.sh
          test -s build/pc2-source/pc2-test16-aio-report.txt
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test16-aio-report.txt
          grep -Fq 'Real game or Wand launched: false' build/pc2-source/pc2-test16-aio-report.txt
      - name: Test 17 GPU-off Wand white-window recovery (no real game)
        run: |
          bash -n scripts/pc2-test17-aio-report.sh
          bash scripts/pc2-test17-aio-report.sh
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test17-aio-report.txt
          grep -Fq 'Real game or Wand started by test: false' build/pc2-source/pc2-test17-aio-report.txt
      - name: Test 18 recovered Wand Native active-Wineserver/X11 integration
        run: |
          bash -n scripts/pc2-test18-aio-report.sh
          bash scripts/pc2-test18-aio-report.sh
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test18-aio-report.txt
          grep -Fq 'Real game/Wand launched by this test: false' build/pc2-source/pc2-test18-aio-report.txt
      - name: Test 19 proven Wand Native 0.1.41 managed-session bridge (no real game)
        run: |
          bash -n scripts/pc2-test19-aio-report.sh
          bash scripts/pc2-test19-aio-report.sh
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test19-aio-report.txt
          grep -Fq 'Real game / Wand / Wine / Proton started by AIO: false' build/pc2-source/pc2-test19-aio-report.txt
      - name: Test 20 GameWeld managed one-Proton-session integration (no real game)
        run: |
          bash -n scripts/pc2-test20-aio-report.sh
          bash scripts/pc2-test20-aio-report.sh
          grep -Fq 'Result: PASS' build/pc2-source/pc2-test20-aio-report.txt
          grep -Fq 'Real game / Wand / Proton started by AIO: false' build/pc2-source/pc2-test20-aio-report.txt
      - name: Wand Enhancer helper
        run: |
          bash -n scripts/gameweld-wand-enhancer.sh
          env -u WAND_ENHANCER_EXE bash scripts/gameweld-wand-enhancer.sh --status
  private-source-portability-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/gameweld-backend/go.mod
          cache: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev pkg-config python3
      - name: Check staging and audit script syntax
        run: |
          bash -n scripts/pc2-stage-private-appdir.sh
          bash -n scripts/pc2-audit-private-appdir.sh
          bash -n scripts/pc2-build-private-appimage.sh
      - name: Test reviewed-library staging fail-closed safeguards
        run: python3 -m unittest discover -s scripts -p 'test_pc2_stage_reviewed_libraries.py' -v
      - name: Test bounded Steam configuration paths
        run: python3 -m unittest discover -s scripts -p 'test_pc2_steam_path_bounds.py' -v
      - name: Test runtime closure classification (offline fixtures)
        run: python3 -m unittest discover -s scripts -p 'test_pc2_runtime_closure.py' -v
      - name: Build private source AppDir
        run: bash scripts/pc2-stage-private-appdir.sh
      - name: Audit AppDir against Ubuntu baseline
        run: bash scripts/pc2-audit-private-appdir.sh
      - name: Inventory dependency provenance (no bundling)
        run: |
          python3 scripts/pc2-inventory-dependencies.py \
            --appdir build/pc2-source/private-AppDir \
            --out build/pc2-source/ubuntu-dependency-inventory.json
      - name: Classify dependencies for manual redistribution review
        run: |
          python3 scripts/pc2-review-dependencies.py \
            --inventory build/pc2-source/ubuntu-dependency-inventory.json \
            --report build/pc2-source/ubuntu-dependency-review.json
      - name: Report static runtime dependency gaps (private, non-blocking)
        run: |
          python3 scripts/pc2-audit-runtime-closure.py \
            --appdir build/pc2-source/private-AppDir \
            --report build/pc2-source/ubuntu-runtime-closure.json
      - name: Record host dependency and ELF metadata
        run: |
          file build/pc2-source/private-AppDir/usr/bin/gameweld
          file build/pc2-source/private-AppDir/usr/bin/wand-native-backend
          readelf -W -V build/pc2-source/private-AppDir/usr/bin/gameweld | grep -E 'GLIBC_|GLIBCXX_' || true
          sha256sum build/pc2-source/private-AppDir/usr/bin/gameweld build/pc2-source/private-AppDir/usr/bin/wand-native-backend
      - name: Assert host-dependent AppDir fails strict portability gate
        run: |
          set +e
          python3 scripts/pc2-audit-runtime-closure.py \
            --appdir build/pc2-source/private-AppDir \
            --report build/pc2-source/ubuntu-runtime-closure-strict.json \
            --require-closure
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "FAIL: expected strict closure rejection (exit 2), got $status" >&2
            exit 1
          fi
          echo "PASS: current host-dependent AppDir correctly rejected by strict portability gate"
      - name: Test merged-usr license evidence lookup
        run: python3 -m unittest discover -s scripts -p 'test_pc2_license_evidence.py' -v
      - name: Collect Ubuntu library copyright provenance hints
        run: |
          python3 scripts/pc2-license-evidence.py \
            --inventory build/pc2-source/ubuntu-dependency-inventory.json \
            --out build/pc2-source/ubuntu-license-evidence.json
      - name: Summarize private runtime audit gates
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = Path("build/pc2-source")
          closure = json.loads((base / "ubuntu-runtime-closure.json").read_text())
          review = json.loads((base / "ubuntu-dependency-review.json").read_text())
          lines = [
              "## GameWeld private Ubuntu portability audit",
              "",
              f"- Direct unbundled ELF SONAMEs: {len(closure['unbundled_dependencies'])}",
              f"- Dependencies requiring manual review: {review['review_required']}",
              "- Portable AppImage: **not verified**",
              "- Redistribution: **not approved**",
              "",
              "### Direct unbundled dependencies",
              *[f"- `{name}`" for name in closure['unbundled_dependencies']],
              "",
              "Static analysis does not cover dlopen modules, runtime launch, or cross-distro compatibility."
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Upload private audit JSON reports (no executables)
        uses: actions/upload-artifact@v4
        with:
          name: gameweld-private-ubuntu-audit-json
          path: |
            build/pc2-source/ubuntu-dependency-inventory.json
            build/pc2-source/ubuntu-dependency-review.json
            build/pc2-source/ubuntu-runtime-closure.json
            build/pc2-source/ubuntu-license-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publication remains blocked
        run: |
          echo 'Ubuntu baseline build check only.'
          echo 'No AppImage is published, uploaded or claimed portable.'
          echo 'Real GTK launches, WeMod tests, dependency bundling and licensing remain separate gates.'
