name: PC2 Backend (experimental)
on:
  push:
    branches:
      - feature/pc2-source-backend
  pull_request:
    paths:
      - 'cmd/gameweld-backend/**'
      - 'scripts/run-pc2-source-frontend.sh'
      - 'scripts/gameweld-wand-enhancer.sh'
      - '.github/workflows/pc2-backend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Go protocol and race tests
        working-directory: cmd/gameweld-backend
        run: go test -race -count=1 ./...
      - name: Static analysis
        working-directory: cmd/gameweld-backend
        run: go vet ./...
      - name: Build source backend
        working-directory: cmd/gameweld-backend
        run: go build -trimpath -o /tmp/wand-native-backend .
      - name: Build PC2 GTK frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev
          gcc -O2 -pipe -pthread crates/wand-ui/appimage-gtk3/gameweld-native-040.c -o /tmp/gameweld-pc2 $(pkg-config --cflags --libs gtk+-3.0)
      - name: Verify source helper AppDir layout
        run: |
          bash scripts/run-pc2-source-frontend.sh --check-layout
          test -f build/pc2-source/dev-AppDir/usr/libexec/gameweld-wand-discovery.py
          test -f build/pc2-source/dev-AppDir/usr/libexec/gameweld-trainer-library.py
          mkdir -p "$RUNNER_TEMP/pc2-empty-home"
          python3 build/pc2-source/dev-AppDir/usr/libexec/gameweld-wand-discovery.py --home "$RUNNER_TEMP/pc2-empty-home" --tsv | grep '^STATUS'
      - name: Wand Enhancer integration smoke (no Wine or patch execution)
        run: |
          bash -n scripts/gameweld-wand-enhancer.sh
          env -u WAND_ENHANCER_EXE bash scripts/gameweld-wand-enhancer.sh --status
