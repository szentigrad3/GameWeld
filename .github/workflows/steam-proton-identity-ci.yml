name: Steam Proton process identity regression tests

on:
  push:
    branches:
      - fix/wand-v2-proton-game-identity-batch13-20261030
  pull_request:
    paths:
      - 'scripts/gameweld-wand-v2-live-context.py'
      - 'scripts/gameweld-wand-v2-live-anchor.py'
      - 'scripts/gameweld-wand-v2-session.py'
      - 'scripts/test-gameweld-wand-v2-*.py'
      - '.github/workflows/steam-proton-identity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-process-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax and import compilation
        run: |
          python -m py_compile scripts/gameweld-wand-v2-live-context.py scripts/gameweld-wand-v2-live-anchor.py scripts/gameweld-wand-v2-session.py
      - name: Batch 13 game identity tests
        run: python scripts/test-gameweld-wand-v2-live-context.py -v
      - name: Batch 14 bounded liveness tests
        run: python scripts/test-gameweld-wand-v2-live-anchor.py -v
      - name: Batch 15 session pre-handoff tests
        run: python scripts/test-gameweld-wand-v2-session-gate.py -v
