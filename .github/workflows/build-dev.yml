name: Build development AppImage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc python3 libgtk-3-dev
      - name: Run offline checks
        run: ./scripts/ci-check.sh
      - name: Download pinned 0.7.0 runtime baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download v0.7.0 --repo "$GITHUB_REPOSITORY" --pattern 'GameWeld-0.7.0-x86_64.AppImage' --dir build
          cd build
          sha256sum --check ../docs/BASELINE-SHA256.txt
          chmod +x GameWeld-0.7.0-x86_64.AppImage
      - name: Build the development AppImage
        run: |
          ./MAKE-APPIMAGE.sh "$PWD/build/GameWeld-0.7.0-x86_64.AppImage" "$PWD/build/GameWeld-0.8.0-dev1-x86_64.AppImage"
          sha256sum build/GameWeld-0.8.0-dev1-x86_64.AppImage > build/SHA256SUMS.txt
      - name: Upload for maintainer review (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: gameweld-0.8.0-dev1-linux-x86_64
          path: |
            build/GameWeld-0.8.0-dev1-x86_64.AppImage
            build/SHA256SUMS.txt
          if-no-files-found: error
